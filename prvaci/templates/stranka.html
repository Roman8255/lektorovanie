<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Bednárik</title>
    <meta name="description" content="Stránka o mne">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eee;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #0f3460);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #e94560;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 28px 0;
        }

        .bio {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 32px;
        }

        .bio strong {
            color: #e94560;
        }

        .zaguby-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 16px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tag {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            color: #e94560;
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🧑‍💻</div>
        <h1>Roman Bednárik</h1>
        <p class="subtitle">Developer &amp; Lektor</p>
        <div class="divider"></div>
        <p class="bio">
            Volám sa Roman a rád <strong>programujem</strong>.<br>
            Venujem sa vývoju webových aplikácií a učím ostatných kódovať.
        </p>
        <div class="divider"></div>
        <p class="zaguby-title">Moje záľuby</p>
        <div class="tags">
            <span class="tag">🐍 Python</span>
            <span class="tag">⚡ FastAPI</span>
            <span class="tag">🌐 Web dev</span>
            <span class="tag">📚 Lektorovanie</span>
        </div>
    </div>
</body>
</html>
