<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Flap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="intro">
        <p class="eyebrow">HTML + CSS + JavaScript</p>
        <h1>Cat Flap</h1>
        <p class="description">
          Klikni alebo stlac medzernik a pomoz macicke preskakovat medzi
          natiahnutymi macacimi prekazkami.
        </p>
      </section>

      <section class="game-panel">
        <div class="hud">
          <div>
            <span class="label">Skore</span>
            <strong id="score">0</strong>
          </div>
          <button id="restartButton" type="button">Restart</button>
        </div>

        <canvas
          id="gameCanvas"
          width="420"
          height="640"
          aria-label="Hra s lietajucou macickou"
        ></canvas>

        <p class="hint">Ovládanie: klik, tap alebo medzernik</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
